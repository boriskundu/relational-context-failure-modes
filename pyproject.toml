[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-docs"
version = "0.1.0"
description = "Failure modes of imperfect relational context in LLM document extraction (FUNSD)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Boris Kundu", email = "boriskundu@gmail.com" },
    { name = "Pooja Mehta", email = "poojamehta.mba@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.1",
    "groq>=0.11",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "rapidfuzz>=3.9",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]
ocr = [
    "pytesseract>=0.3",
    "paddleocr>=2.7",
    "Pillow>=10.0",
]

[project.scripts]
docs = "agentic_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_docs = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
markers = [
    "real: requires live API keys or network access (excluded by default)",
]
addopts = "-m 'not real'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
